name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy using docker compose
        run: |
          cd /home/purnika/Portfolio
          git fetch origin main
          git reset --hard origin/main

          docker compose up -d --build
          docker image prune -f